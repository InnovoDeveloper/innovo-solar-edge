provision_dashboards:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: innovo_solar_edge
    energy_dashboard:
      default: true
      selector:
        boolean:
    dashboard:
      default: true
      selector:
        boolean:
    url_path:
      example: solar-energy
      selector:
        text:
    title:
      example: Solar & Energy
      selector:
        text:
set_tariff:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: innovo_solar_edge
    plan:
      required: true
      selector:
        object:
set_tariff_rates:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: innovo_solar_edge
    rates:
      required: true
      example: '{"On-peak": 0.64, "Off-peak": 0.40}'
      selector:
        object:
    season:
      example: Summer
      selector:
        text:
